name: Sync issue DTS Status field with issue state

on:
  issues:
    types: [closed, reopened]

permissions:
  issues: write

jobs:
  update-status-field:
    runs-on: ubuntu-latest
    steps:
      - name: Update custom issue field
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_MANAGEMENT_PAT }}
          script: |
            const issue = context.payload.issue;
            const statusFieldID = "IFSS_kgDNJ_I";
            const closedOptionID = "IFSSO_kgDOBJ2T6g";
            const newOptionID = "IFSSO_kgDNOPE";
            const desiredOptionID = issue.state === "closed" ? closedOptionID : newOptionID;

            console.log(issue)

            // Set the field value
            await github.graphql(`
              mutation($issueId: ID!, $fieldId: ID!, $optionId: String!) {
                setIssueFieldValue(input: {
                  issueId: $issueId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  clientMutationId
                }
              }
            `, {
              issueId: issue.node_id,
              fieldId: statusFieldID,
              optionId: desiredOptionID
            });

            console.log(`Updated issue #${issue.number} Status);
